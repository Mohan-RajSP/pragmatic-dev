# =========================================================
# Pragmatic-dev — Docker Compose (development orchestration)
#
# Services:
#   redis    - cache + Celery broker/back-end
#   backend  - FastAPI (tips + chat)          -> internal :8000
#   worker   - Celery worker (consumes tasks)
#   beat     - Celery Beat scheduler (enqueues periodic tips)
#   nginx    - reverse proxy                   -> published :80
#   baseapp  - single-spa shell (frontend)     -> profile "frontend" (built later)
#
# Bring up the backend stack:      docker compose up --build
# Include the frontend shell:      docker compose --profile frontend up --build
# =========================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pragmatic

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Ensure intra-compose networking regardless of .env contents.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "8000"
    ports:
      # Published for direct access during development (nginx also proxies it).
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pragmatic

  worker:
    build: ./worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - path: ./worker/.env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pragmatic

  beat:
    build: ./worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - path: ./worker/.env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pragmatic

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - pragmatic

  baseapp:
    build: ./frontend/baseapp
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      # Published so the browser can fetch the shell bundle referenced in the
      # SystemJS import-map (//localhost:9000/...).
      - "9000:9000"
    # Not started by default (frontend built in a later phase). Enable with:
    #   docker compose --profile frontend up
    profiles:
      - frontend
    networks:
      - pragmatic

  tipsapp:
    build: ./frontend/tipsapp
    restart: unless-stopped
    expose:
      - "9001"
    ports:
      # Published so the browser can load the tips MFE bundle via the import-map.
      - "9001:9001"
    profiles:
      - frontend
    networks:
      - pragmatic

networks:
  pragmatic:
    driver: bridge

