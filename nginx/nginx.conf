# =========================================================
# Pragmatic-dev — nginx reverse proxy
#   /api/  -> backend (FastAPI)   — SSE/streaming friendly
#   /      -> baseapp (single-spa shell)
# =========================================================

server {
    listen 80;
    server_name pragmatic-dev.in localhost;

    # Reasonable upload ceiling (raised later for file-upload feature).
    client_max_body_size 10m;

    # ----- Backend API -----
    # Trailing slash on proxy_pass strips the "/api" prefix:
    #   /api/tip -> backend:8000/tip
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE / streaming: never buffer, keep the connection open ---
        proxy_set_header Connection        "";
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
    }

    # ----- Frontend shell (single-spa baseapp) -----
    # A variable + Docker's embedded DNS resolver means nginx starts even if
    # baseapp isn't running yet (returns 502 on "/" until the frontend is up),
    # while "/api" keeps working. Resolve baseapp lazily at request time.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $baseapp "http://baseapp:9000";
        proxy_pass $baseapp;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow WebSocket upgrade (webpack dev server / HMR).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

